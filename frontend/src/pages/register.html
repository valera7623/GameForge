<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="register.title">Create account — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") !== "en") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <button type="button" class="btn-icon theme-toggle theme-toggle-float" data-theme-toggle data-i18n="theme.toggle" data-i18n-attr="aria-label">☾</button>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">GameForge</span></a>
      <h1 data-i18n="register.h1">Create account</h1>
      <p class="sub" data-i18n="register.sub">Start forging in under a minute</p>
      <form id="regForm" class="auth-form">
        <div class="field">
          <label class="field-label" for="regName" data-i18n="register.name">Full name</label>
          <input id="regName" name="full_name" autocomplete="name" data-i18n="register.name_ph" data-i18n-attr="placeholder" placeholder="Your name" />
        </div>
        <div class="field">
          <label class="field-label" for="regEmail" data-i18n="login.email">Email</label>
          <input id="regEmail" type="email" name="email" required autocomplete="email" inputmode="email" data-i18n="register.email_ph" data-i18n-attr="placeholder" placeholder="you@email.com" />
        </div>
        <div class="field">
          <label class="field-label" for="regPassword" data-i18n="login.password">Password</label>
          <input id="regPassword" type="password" name="password" required minlength="10" autocomplete="new-password" data-i18n="register.password_ph" data-i18n-attr="placeholder" placeholder="At least 10 characters" />
          <p class="field-hint" data-i18n="register.password_hint">Minimum 10 characters</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="register.submit">Create account</button>
        <p class="field-hint register-legal" data-i18n="register.legal" data-i18n-html>
          By creating an account you accept the <a href="/offer">public offer</a> and confirm the <a href="/contacts">seller details</a>.
        </p>
      </form>
      <p class="auth-footer">
        <span data-i18n="register.have">Already have an account?</span>
        <a href="/login" data-i18n="register.signin">Sign in</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { mergeAttributionOverrides, trackEvent } from "../js/analytics.js";
    import { redirectIfAuthed, register, safeNextPath } from "../js/auth.js";
    import { applyDomI18n, toast } from "../js/app.js";
    import { applyTheme, bindThemeToggles, getTheme } from "../js/theme.js";
    applyDomI18n(document);
    applyTheme(getTheme());
    bindThemeToggles();
    redirectIfAuthed();
    const params = new URLSearchParams(location.search);
    const next = safeNextPath(params.get("next"), "/dashboard");
    const emailPrefill = params.get("email");
    const from = (params.get("from") || "").trim();
    const pack = (params.get("pack") || "").trim();
    if (from || pack) mergeAttributionOverrides({ from: from || undefined, pack: pack || undefined });
    if (emailPrefill) {
      const emailInput = document.getElementById("regEmail");
      if (emailInput) emailInput.value = emailPrefill;
    }
    const signinLink = document.querySelector(".auth-footer a[href='/login'], .auth-footer a[href^=\"/login\"]");
    if (signinLink) {
      const q = new URLSearchParams({ next });
      if (emailPrefill) q.set("email", emailPrefill);
      if (from) q.set("from", from);
      if (pack) q.set("pack", pack);
      signinLink.href = `/login?${q}`;
    }
    if (from === "locforge") {
      const sub = document.querySelector(".auth-card .sub");
      if (sub) sub.setAttribute("data-i18n", "register.sub_locforge");
      applyDomI18n(document);
    }
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await register(fd.get("email"), fd.get("password"), fd.get("full_name") || null, {
          signup_source: from || undefined,
          signup_pack: pack || undefined,
        });
        trackEvent("sign_up_complete", { from: from || undefined, pack: pack || undefined });
        const dest = new URL(next, location.origin);
        if (pack && !dest.searchParams.get("pack")) dest.searchParams.set("pack", pack);
        location.href = dest.pathname + dest.search;
      } catch (err) {
        toast(err.message, true);
      }
    });
  </script>
</body>
</html>
