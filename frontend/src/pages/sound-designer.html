<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Designer — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">
      <div class="page-header">
        <div>
          <h1>AI Sound Designer</h1>
          <p>Generate SFX and mood-based music loops.</p>
        </div>
      </div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label>Description
            <textarea name="description" required placeholder="Heavy stone door opening in a dungeon"></textarea>
          </label>
          <div class="form-row">
            <label>Kind
              <select name="kind"><option value="sfx">SFX</option><option value="music">Music</option></select>
            </label>
            <label>Mood
              <select name="mood">
                <option>dark</option><option>heroic</option><option>calm</option><option>tense</option><option>magic</option>
              </select>
            </label>
            <label>Duration (sec) <input type="number" name="duration_sec" value="5" min="1" max="30" /></label>
            <label>Project
              <select name="project_id" id="projectSelect"><option value="">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">Generate audio</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> Synthesizing…</div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <audio id="player" controls style="width:100%"></audio>
        <div class="actions">
          <a class="btn btn-primary" id="dlLink" download="audio.wav">Download</a>
        </div>
      </div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI } from "../js/api.js";
    import { mountShell, setLoading, toast } from "../js/app.js";

    if (!requireAuth()) throw new Error("auth");
    mountShell("sound-designer.html");

    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        const body = Object.fromEntries(fd.entries());
        body.duration_sec = Number(body.duration_sec);
        if (!body.project_id) delete body.project_id;
        const gen = await ToolsAPI.sound(body);
        const out = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        document.getElementById("player").src = out.url;
        document.getElementById("dlLink").href = out.url;
        document.getElementById("dlLink").download = `audio.${out.format || "wav"}`;
        toast(`Audio ready · +${gen.xp_awarded} XP`);
      } catch (err) { toast(err.message, true); }
      finally { setLoading(document.getElementById("loader"), false); }
    });
  </script>
</body>
</html>
