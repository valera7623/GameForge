<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="sound.title">Sound Designer — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">

      <div class="page-header"><div>
        <h1 data-i18n="sound.h1">AI Sound Designer</h1>
        <p data-i18n="sound.sub">Generate SFX and mood-based music loops.</p>
      </div></div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label><span data-i18n="sound.desc">Description</span>
            <textarea name="description" required data-i18n="sound.desc_ph" data-i18n-attr="placeholder"></textarea>
          </label>
          <div class="form-row">
            <label><span data-i18n="sound.kind">Kind</span>
              <select name="kind"><option value="sfx">SFX</option><option value="music">Music</option></select>
            </label>
            <label><span data-i18n="sound.mood">Mood</span>
              <select name="mood"><option value="dark">Dark</option><option value="heroic">Heroic</option><option value="calm">Calm</option><option value="tense">Tense</option><option value="magic">Magic</option></select>
            </label>
            <label><span data-i18n="sound.duration">Duration (sec)</span> <input type="number" name="duration_sec" value="5" min="1" max="30" /></label>
            <label><span data-i18n="common.project">Project</span>
              <select name="project_id" id="projectSelect"><option value="" data-i18n="common.none">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="sound.submit">Generate audio</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> <span data-i18n="sound.loading">Synthesizing…</span></div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <audio id="player" controls style="width:100%"></audio>
        <div class="actions"><a class="btn btn-primary" id="dlLink" data-i18n="sound.dl">Download</a></div>
      </div>
      <div class="panel" id="toolHistory" style="margin-top:1rem"></div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI, pollGeneration } from "../js/api.js";
    import { mountToolHistory } from "../js/tool-history.js";
    import { applyDomI18n, mountShell, setLoading, toast, t } from "../js/app.js";
    if (!requireAuth()) throw new Error("auth");
    mountShell("sound-designer");
    applyDomI18n(document);
    mountToolHistory("sound_designer");
    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        const body = Object.fromEntries(fd.entries());
        body.duration_sec = Number(body.duration_sec);
        if (!body.project_id) delete body.project_id;
        let gen = await ToolsAPI.sound(body);
        if (gen.status === "processing" || gen.status === "pending") {
          toast(t("common.queued"));
          gen = await pollGeneration(gen.id);
        }
        if (gen.status === "failed") throw new Error(gen.error_message || "Generation failed");
        const out = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        document.getElementById("player").src = out.url;
        document.getElementById("dlLink").href = out.url;
        document.getElementById("dlLink").download = `audio.${out.format || "wav"}`;
        toast(t("sound.toast", { xp: gen.xp_awarded }));
      } catch (err) { toast(err.message, true); }
      finally { setLoading(document.getElementById("loader"), false); }
    });
  </script>
</body>
</html>
