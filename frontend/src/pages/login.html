<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <button type="button" class="btn-icon theme-toggle theme-toggle-float" data-theme-toggle aria-label="Toggle theme">☾</button>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="/">GameForge</a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your forge</p>
      <form id="loginForm" class="form-grid">
        <label>Email <input type="email" name="email" required placeholder="dev@studio.com" /></label>
        <label>Password <input type="password" name="password" required minlength="6" /></label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
        No account? <a href="/src/pages/register.html">Create one</a> ·
        <a href="#" id="forgotLink">Forgot password</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { redirectIfAuthed, login } from "../js/auth.js";
    import { AuthAPI } from "../js/api.js";
    import { toast } from "../js/app.js";
    import { applyTheme, bindThemeToggles, getTheme } from "../js/theme.js";
    applyTheme(getTheme());
    bindThemeToggles();
    redirectIfAuthed();
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await login(fd.get("email"), fd.get("password"));
        location.href = "/src/pages/dashboard.html";
      } catch (err) {
        toast(err.message, true);
      }
    });
    document.getElementById("forgotLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = prompt("Email for password reset:");
      if (!email) return;
      try {
        const res = await AuthAPI.passwordReset(email);
        toast(res.reset_token ? `Token: ${res.reset_token}` : res.message);
      } catch (err) {
        toast(err.message, true);
      }
    });
  </script>
</body>
</html>
