<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.title">Sign in — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <button type="button" class="btn-icon theme-toggle theme-toggle-float" data-theme-toggle data-i18n="theme.toggle" data-i18n-attr="aria-label">☾</button>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">GameForge</span></a>
      <h1 data-i18n="login.h1">Welcome back</h1>
      <p class="sub" data-i18n="login.sub">Sign in to your forge</p>
      <form id="loginForm" class="form-grid">
        <label><span data-i18n="login.email">Email</span> <input type="email" name="email" required placeholder="dev@studio.com" /></label>
        <label><span data-i18n="login.password">Password</span> <input type="password" name="password" required minlength="10" /></label>
        <button class="btn btn-primary" type="submit" id="loginBtn" data-i18n="login.submit">Sign in</button>
        <div class="loader" id="loginLoader"><div class="spinner"></div> <span data-i18n="login.signing">Signing in…</span></div>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
        <span data-i18n="login.no_account">No account?</span> <a href="/register" data-i18n="login.create">Create one</a> ·
        <a href="#" id="forgotLink" data-i18n="login.forgot">Forgot password</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { redirectIfAuthed, login, t, safeNextPath } from "../js/auth.js";
    import { AuthAPI } from "../js/api.js";
    import { applyDomI18n, showModal, setLoading, toast } from "../js/app.js";
    import { applyTheme, bindThemeToggles, getTheme } from "../js/theme.js";
    applyDomI18n(document);
    applyTheme(getTheme());
    bindThemeToggles();
    redirectIfAuthed();
    const params = new URLSearchParams(location.search);
    const next = safeNextPath(params.get("next"), "/dashboard");
    const emailPrefill = params.get("email");
    if (emailPrefill) {
      const emailInput = document.querySelector('input[name="email"]');
      if (emailInput) emailInput.value = emailPrefill;
    }
    const createLink = document.querySelector('a[href="/register"]');
    if (createLink) {
      const q = new URLSearchParams({ next });
      if (emailPrefill) q.set("email", emailPrefill);
      createLink.href = `/register?${q}`;
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      setLoading(document.getElementById("loginLoader"), true);
      try {
        await login(fd.get("email"), fd.get("password"));
        location.href = next;
      } catch (err) {
        const msg = err.message || "";
        if (msg.includes("Invalid credentials") && next.includes("accept-invite")) {
          toast(t("login.invite_need_register"), true);
        } else {
          toast(msg, true);
        }
      } finally {
        btn.disabled = false;
        setLoading(document.getElementById("loginLoader"), false);
      }
    });
    document.getElementById("forgotLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const data = await showModal({
        title: t("modal.reset_title"),
        confirmLabel: t("modal.send"),
        fields: [{ name: "email", label: t("modal.reset_email"), type: "email" }],
      });
      if (!data?.email) return;
      try {
        const res = await AuthAPI.passwordReset(data.email);
        toast(res.reset_token ? `Token: ${res.reset_token}` : res.message);
      } catch (err) {
        toast(err.message, true);
      }
    });
  </script>
</body>
</html>
