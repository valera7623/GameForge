<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Subscriptions — Admin — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg-grid"></div>

  <div class="app-shell"><main class="main-panel">
    <div class="page-header"><div><h1 data-i18n="admin.subs.h1">Subscriptions</h1></div></div>
    <div class="admin-filters">
      <select id="plan"><option value="">All plans</option><option>free</option><option>indie</option><option>studio</option><option>enterprise</option></select>
      <select id="status"><option value="">All status</option><option>active</option><option>canceled</option><option>past_due</option><option>trialing</option></select>
      <button class="btn btn-primary" id="go" data-i18n="admin.search">Search</button>
    </div>
    <div class="panel"><div class="admin-table-wrap"><table class="admin-table" id="tbl">
      <thead><tr><th>User</th><th>Plan</th><th>Status</th><th>Limit</th><th>Period end</th><th></th></tr></thead><tbody></tbody>
    </table></div><div id="pager"></div></div>
  </main></div>
  <script type="module">
import { requireStaff, mountAdminShell, AdminAPI, escapeHtml, applyDomI18n, pagerHtml, t, canWriteSubs } from "../../js/admin.js";
import { toast } from "../../js/app.js";

(async () => {
      const me = await requireStaff();
      if (!me) throw new Error("staff");
      mountAdminShell("subscriptions");
      applyDomI18n(document);
      let page = 1;
      async function load() {
        const params = { page, page_size: 20 };
        const plan = document.getElementById("plan").value;
        const status = document.getElementById("status").value;
        if (plan) params.plan = plan;
        if (status) params.status = status;
        const data = await AdminAPI.subscriptions(params);
        const write = canWriteSubs(me.role);
        document.querySelector("#tbl tbody").innerHTML = data.items.map((s) => `<tr>
          <td><a href="/admin/user?id=${s.user_id}">${escapeHtml(s.user_email || s.user_id)}</a></td>
          <td>${escapeHtml(s.plan)}</td><td>${escapeHtml(s.status)}</td><td>${s.generations_limit}</td>
          <td>${escapeHtml(s.current_period_end || "—")}</td>
          <td>${write && s.status === "active" && s.plan !== "free" ? `<button class="btn btn-ghost" data-cancel="${s.id}">Cancel</button>` : ""}</td>
        </tr>`).join("") || `<tr><td colspan="6">${escapeHtml(t("admin.empty"))}</td></tr>`;
        document.getElementById("pager").innerHTML = pagerHtml(data.page, data.page_size, data.total);
        document.querySelectorAll("#pager [data-page]").forEach((b) => b.addEventListener("click", () => {
          const p = Number(b.dataset.page); if (p >= 1) { page = p; load(); }
        }));
        document.querySelectorAll("[data-cancel]").forEach((b) => b.addEventListener("click", async () => {
          if (!confirm("Cancel subscription?")) return;
          try { await AdminAPI.cancelSubscription(b.dataset.cancel); toast("Canceled"); load(); }
          catch (e) { toast(e.message, true); }
        }));
      }
      document.getElementById("go").onclick = () => { page = 1; load(); };
      load();
})().catch((e) => { console.error(e); });
</script>
</body></html>
