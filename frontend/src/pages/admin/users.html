<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Users — Admin — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg-grid"></div>

  <div class="app-shell"><main class="main-panel">
    <div class="page-header"><div><h1 data-i18n="admin.users.h1">Users</h1></div></div>
    <div class="admin-filters">
      <input id="q" type="search" placeholder="Search…" />
      <select id="role"><option value="">All roles</option>
        <option>super_admin</option><option>admin</option><option>manager</option><option>support</option><option>user</option><option>enterprise</option>
      </select>
      <select id="plan"><option value="">All plans</option>
        <option>free</option><option>indie</option><option>studio</option><option>enterprise</option>
      </select>
      <button class="btn btn-primary" id="searchBtn" data-i18n="admin.search">Search</button>
    </div>
    <div class="panel"><div class="admin-table-wrap"><table class="admin-table" id="tbl">
      <thead><tr><th>Email</th><th>Role</th><th>Plan</th><th>Gens</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div><div id="pager"></div></div>
  </main></div>
  <script type="module">
import { requireStaff, mountAdminShell, AdminAPI, escapeHtml, applyDomI18n, pagerHtml, t, canWriteUsers } from "../../js/admin.js";
import { toast } from "../../js/app.js";

(async () => {
      const me = await requireStaff();
      if (!me) throw new Error("staff");
      mountAdminShell("users");
      applyDomI18n(document);
      let page = 1;
      async function load() {
        const params = { page, page_size: 20 };
        const q = document.getElementById("q").value.trim();
        const role = document.getElementById("role").value;
        const plan = document.getElementById("plan").value;
        if (q) params.q = q;
        if (role) params.role = role;
        if (plan) params.plan = plan;
        const data = await AdminAPI.users(params);
        const write = canWriteUsers(me.role);
        document.querySelector("#tbl tbody").innerHTML = data.items.map((u) => `<tr>
          <td>${escapeHtml(u.email)}</td>
          <td>${escapeHtml(u.role)}</td>
          <td>${escapeHtml(u.plan || "—")}</td>
          <td>${u.generations_this_month}/${u.generations_limit}</td>
          <td><span class="admin-dot ${u.is_active ? "on" : "off"}"></span>${u.is_active ? "active" : "blocked"}</td>
          <td class="admin-actions">
            <a class="btn btn-ghost" href="/admin/user?id=${u.id}">${escapeHtml(t("admin.open"))}</a>
            ${write ? `<button type="button" class="btn btn-ghost" data-act="${u.is_active ? "block" : "unblock"}" data-id="${u.id}">${u.is_active ? "Block" : "Unblock"}</button>` : ""}
          </td>
        </tr>`).join("") || `<tr><td colspan="6">${escapeHtml(t("admin.empty"))}</td></tr>`;
        document.getElementById("pager").innerHTML = pagerHtml(data.page, data.page_size, data.total);
        document.querySelectorAll("#pager [data-page]").forEach((b) => b.addEventListener("click", () => {
          const p = Number(b.dataset.page);
          if (p >= 1) { page = p; load(); }
        }));
        document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", async () => {
          try {
            if (b.dataset.act === "block") await AdminAPI.blockUser(b.dataset.id);
            else await AdminAPI.unblockUser(b.dataset.id);
            toast("OK");
            load();
          } catch (e) { toast(e.message, true); }
        }));
      }
      document.getElementById("searchBtn").addEventListener("click", () => { page = 1; load(); });
      load();
})().catch((e) => { console.error(e); });
</script>
</body></html>
