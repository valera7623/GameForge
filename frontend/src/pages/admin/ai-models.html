<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AI Models — Admin — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg-grid"></div>
  <div class="app-shell"><main class="main-panel">
    <div class="page-header"><div><h1 data-i18n="admin.ai.h1">AI models & costs</h1></div></div>
    <div class="panel"><h2 data-i18n="admin.ai.costs">Costs (30d)</h2><div id="costs" class="muted"></div></div>
    <div class="panel"><h2 data-i18n="admin.ai.pricing">Pricing</h2><pre id="pricing" class="admin-mono"></pre>
      <div class="admin-actions" id="actions"></div></div>
  </main></div>
  <script type="module">
import { requireStaff, mountAdminShell, AdminAPI, escapeHtml, applyDomI18n, t, canWriteSettings } from "../../js/admin.js";
import { toast } from "../../js/app.js";
(async () => {
  const me = await requireStaff();
  if (!me) throw new Error("staff");
  mountAdminShell("ai-models");
  applyDomI18n(document);
  const write = canWriteSettings(me.role);
  const [models, costs] = await Promise.all([AdminAPI.aiModels(), AdminAPI.aiCosts({ days: 30 })]);
  document.getElementById("costs").innerHTML = `<p><strong>$${costs.total_usd.toFixed(4)}</strong></p>` +
    `<p>${costs.by_tool.map(x => `${escapeHtml(x.tool)}: $${Number(x.cost_usd).toFixed(4)} (${x.count})`).join(" · ") || "—"}</p>`;
  const raw = JSON.stringify(models.models, null, 2);
  if (write) {
    document.getElementById("pricing").outerHTML = `<textarea id="pricing" class="admin-mono" rows="16" style="width:100%">${escapeHtml(raw)}</textarea>`;
    document.getElementById("actions").innerHTML = `<button class="btn btn-primary" id="save">${escapeHtml(t("admin.save"))}</button>`;
    document.getElementById("save").onclick = async () => {
      try {
        const parsed = JSON.parse(document.getElementById("pricing").value);
        await AdminAPI.saveAiModels(parsed);
        toast("Saved");
      } catch (e) { toast(e.message, true); }
    };
  } else {
    document.getElementById("pricing").textContent = raw;
  }
})().catch(console.error);
</script>
</body>
</html>
