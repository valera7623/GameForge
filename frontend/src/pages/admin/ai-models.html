<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AI Models — Admin — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg-grid"></div>
  <div class="app-shell"><main class="main-panel">
    <div class="page-header"><div><h1 data-i18n="admin.ai.h1">AI models & costs</h1></div></div>
    <div class="panel"><h2 data-i18n="admin.ai.costs">Costs (30d)</h2><div id="costs" class="muted">Loading…</div></div>
    <div class="panel"><h2 data-i18n="admin.ai.pricing">Pricing</h2>
      <textarea id="pricing" class="admin-mono" rows="16" style="width:100%" disabled></textarea>
      <div class="admin-actions" id="actions"></div>
    </div>
  </main></div>
  <script type="module">
import { requireStaff, mountAdminShell, AdminAPI, escapeHtml, applyDomI18n, t, canWriteSettings } from "../../js/admin.js";
import { toast } from "../../js/app.js";

(async () => {
  const me = await requireStaff();
  if (!me) throw new Error("staff");
  mountAdminShell("ai-models");
  applyDomI18n(document);
  const write = canWriteSettings(me.role);
  const pricingEl = document.getElementById("pricing");
  const costsEl = document.getElementById("costs");

  let models;
  let costs;
  try {
    models = await AdminAPI.aiModels();
  } catch (e) {
    costsEl.textContent = "";
    toast(e.message || "Failed to load models", true);
    throw e;
  }
  try {
    costs = await AdminAPI.aiCosts({ days: 30 });
  } catch (e) {
    costsEl.innerHTML = `<p class="error-text">${escapeHtml(e.message || "Failed to load costs")}</p>`;
    costs = { total_usd: 0, by_tool: [], by_day: [], by_model: [] };
  }

  costsEl.innerHTML =
    `<p><strong>$${(Number(costs.total_usd) || 0).toFixed(4)}</strong></p>` +
    `<p>${(costs.by_tool || []).map((x) => `${escapeHtml(x.tool)}: $${Number(x.cost_usd).toFixed(4)} (${x.count})`).join(" · ") || "—"}</p>` +
    ((costs.by_model || []).length
      ? `<p class="muted">${costs.by_model.map((x) => `${escapeHtml(x.model)}: $${Number(x.cost_usd).toFixed(4)}`).join(" · ")}</p>`
      : "");

  pricingEl.value = JSON.stringify(models.models || {}, null, 2);
  pricingEl.disabled = !write;
  if (write) {
    document.getElementById("actions").innerHTML =
      `<button type="button" class="btn btn-primary" id="save">${escapeHtml(t("admin.save"))}</button>`;
    document.getElementById("save").onclick = async () => {
      try {
        const parsed = JSON.parse(pricingEl.value);
        await AdminAPI.saveAiModels(parsed);
        toast("Saved");
      } catch (e) {
        toast(e.message || "Save failed", true);
      }
    };
  } else {
    document.getElementById("actions").innerHTML =
      `<p class="muted">${escapeHtml(t("admin.settings.readonly"))}</p>`;
  }
})().catch((e) => {
  console.error(e);
});
</script>
</body>
</html>
