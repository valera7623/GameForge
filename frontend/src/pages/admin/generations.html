<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Generations — Admin — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/css/admin.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg-grid"></div>

  <div class="app-shell"><main class="main-panel">
    <div class="page-header"><div><h1 data-i18n="admin.gens.h1">Generations</h1></div></div>
    <div class="admin-filters">
      <input id="q" type="search" placeholder="User email…" />
      <select id="tool"><option value="">All tools</option>
        <option>level_designer</option><option>quest_generator</option><option>texture_upscaler</option>
        <option>character_creator</option><option>sound_designer</option><option>playtester</option><option>localization</option>
      </select>
      <select id="status"><option value="">All status</option>
        <option>pending</option><option>processing</option><option>completed</option><option>failed</option>
      </select>
      <button class="btn btn-primary" id="go" data-i18n="admin.search">Search</button>
    </div>
    <div class="panel" id="statsPanel"><h2 data-i18n="admin.gens.stats">Stats</h2><div id="stats" class="muted"></div></div>
    <div class="panel"><div class="admin-table-wrap"><table class="admin-table" id="tbl">
      <thead><tr><th>ID</th><th>User</th><th>Tool</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody></tbody>
    </table></div><div id="pager"></div></div>
  </main></div>
  <script type="module">
import { requireStaff, mountAdminShell, AdminAPI, escapeHtml, applyDomI18n, pagerHtml, t } from "../../js/admin.js";
import { statusBadge } from "../../js/app.js";

(async () => {
      const me = await requireStaff();
      if (!me) throw new Error("staff");
      mountAdminShell("generations");
      applyDomI18n(document);
      let page = 1;
      const stats = await AdminAPI.generationStats();
      document.getElementById("stats").textContent = `Total ${stats.total} · ` + stats.by_tool.map((x) => `${x.tool}: ${x.count}`).join(", ");
      async function load() {
        const params = { page, page_size: 20 };
        const q = document.getElementById("q").value.trim();
        const tool = document.getElementById("tool").value;
        const status = document.getElementById("status").value;
        if (q) params.q = q;
        if (tool) params.tool = tool;
        if (status) params.status = status;
        const data = await AdminAPI.generations(params);
        document.querySelector("#tbl tbody").innerHTML = data.items.map((g) => `<tr>
          <td class="admin-mono" style="max-width:8rem;overflow:hidden;text-overflow:ellipsis">${escapeHtml(g.id)}</td>
          <td>${escapeHtml(g.user_email || g.user_id)}</td>
          <td>${escapeHtml(g.tool)}</td>
          <td>${statusBadge(g.status)}</td>
          <td>${escapeHtml(g.created_at)}</td>
          <td><a class="btn btn-ghost" href="/admin/generation?id=${g.id}">${escapeHtml(t("admin.open"))}</a></td>
        </tr>`).join("") || `<tr><td colspan="6">${escapeHtml(t("admin.empty"))}</td></tr>`;
        document.getElementById("pager").innerHTML = pagerHtml(data.page, data.page_size, data.total);
        document.querySelectorAll("#pager [data-page]").forEach((b) => b.addEventListener("click", () => {
          const p = Number(b.dataset.page); if (p >= 1) { page = p; load(); }
        }));
      }
      document.getElementById("go").onclick = () => { page = 1; load(); };
      load();
})().catch((e) => { console.error(e); });
</script>
</body></html>
