<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="texture.title">Texture Upscaler — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">

      <div class="page-header"><div>
        <h1 data-i18n="texture.h1">AI Texture Upscaler</h1>
        <p data-i18n="texture.sub">Upscale game textures with detail enhancement.</p>
      </div></div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label><span data-i18n="texture.image">Image</span> <input type="file" name="file" accept="image/png,image/jpeg,image/webp" required /></label>
          <img id="preview" class="preview-img" hidden alt="" />
          <div class="form-row">
            <label><span data-i18n="texture.scale">Scale</span>
              <select name="scale"><option value="2">2×</option><option value="4">4×</option></select>
            </label>
            <label><span data-i18n="texture.enhance">Enhance</span>
              <select name="enhance"><option value="true" data-i18n="texture.yes">Yes</option><option value="false" data-i18n="texture.no">No</option></select>
            </label>
            <label><span data-i18n="common.project">Project</span>
              <select name="project_id" id="projectSelect"><option value="" data-i18n="common.none">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="texture.submit">Upscale</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> <span id="loaderText" data-i18n="texture.loading">Upscaling…</span></div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <h2 data-i18n="texture.result">Result</h2>
        <p id="sizeInfo" style="color:var(--muted)"></p>
        <img id="resultImg" class="preview-img" alt="" />
        <div class="actions"><a class="btn btn-primary" id="dlLink" download="upscaled.png" data-i18n="common.download">Download</a></div>
      </div>
      <div class="panel" id="toolHistory" style="margin-top:1rem"></div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI, pollGeneration } from "../js/api.js";
    import { mountToolHistory } from "../js/tool-history.js";
    import { applyDomI18n, mountShell, setLoading, toast, t } from "../js/app.js";
    import { previewFile } from "../js/upscaler.js";
    if (!requireAuth()) throw new Error("auth");
    mountShell("texture-upscaler");
    applyDomI18n(document);
    mountToolHistory("texture_upscaler");
    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    });
    document.querySelector('input[type="file"]').addEventListener("change", (e) => {
      const img = document.getElementById("preview");
      img.hidden = false;
      previewFile(e.target.files[0], img);
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        let gen = await ToolsAPI.upscale(fd.get("file"), Number(fd.get("scale")), fd.get("enhance") === "true", fd.get("project_id") || null);
        if (gen.status === "processing" || gen.status === "pending") {
          toast(t("common.queued"));
          const loaderText = document.getElementById("loaderText");
          const started = Date.now();
          // CPU Real-ESRGAN often needs 3–8+ minutes; default poll (3m) is too short.
          gen = await pollGeneration(gen.id, {
            intervalMs: 2000,
            timeoutMs: 900000,
            onTick: () => {
              const sec = Math.round((Date.now() - started) / 1000);
              if (loaderText) loaderText.textContent = `${t("texture.loading_cpu")} (${sec}s)`;
            },
          });
        }
        if (gen.status === "failed") throw new Error(gen.error_message || "Upscale failed");
        const out = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        const provider = out.provider ? ` · ${out.provider}` : "";
        document.getElementById("sizeInfo").textContent =
          `${out.original_size.width}×${out.original_size.height} → ${out.upscaled_size.width}×${out.upscaled_size.height}${provider}`;
        document.getElementById("resultImg").src = out.url;
        document.getElementById("dlLink").href = out.url;
        toast(t("texture.toast", { xp: gen.xp_awarded }));
      } catch (err) { toast(err.message, true); }
      finally { setLoading(document.getElementById("loader"), false); }
    });
  </script>
</body>
</html>
