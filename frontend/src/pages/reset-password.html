<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <button type="button" class="btn-icon theme-toggle theme-toggle-float" data-theme-toggle aria-label="Toggle theme">☾</button>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="/">GameForge</a>
      <h1>Reset password</h1>
      <p class="sub">Choose a new password for your account</p>
      <form id="form" class="form-grid">
        <label>New password <input type="password" name="password" required minlength="6" /></label>
        <button class="btn btn-primary" type="submit">Update password</button>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
        <a href="/src/pages/login.html">Back to sign in</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { api } from "../js/api.js";
    import { toast } from "../js/app.js";
    import { applyTheme, bindThemeToggles, getTheme } from "../js/theme.js";
    applyTheme(getTheme());
    bindThemeToggles();

    const token = new URLSearchParams(location.search).get("token");
    if (!token) toast("Missing reset token", true);

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!token) return;
      const fd = new FormData(e.target);
      try {
        await api("/auth/password-reset/confirm", {
          method: "POST",
          body: JSON.stringify({ token, new_password: fd.get("password") }),
        });
        toast("Password updated");
        location.href = "/src/pages/login.html";
      } catch (err) {
        toast(err.message, true);
      }
    });
  </script>
</body>
</html>
