<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="reset.title">Reset password — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") !== "en") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <button type="button" class="btn-icon theme-toggle theme-toggle-float" data-theme-toggle data-i18n="theme.toggle" data-i18n-attr="aria-label">☾</button>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">GameForge</span></a>
      <h1 data-i18n="reset.h1">Reset password</h1>
      <p class="sub" data-i18n="reset.sub">Choose a new password for your account</p>
      <form id="form" class="form-grid">
        <label><span data-i18n="reset.password">New password</span> <input type="password" name="password" required minlength="10" /></label>
        <button class="btn btn-primary" type="submit" data-i18n="reset.submit">Update password</button>
      </form>
      <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
        <a href="/login" data-i18n="register.signin">Sign in</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { api } from "../js/api.js";
    import { applyDomI18n, toast, t } from "../js/app.js";
    import { applyTheme, bindThemeToggles, getTheme } from "../js/theme.js";
    applyDomI18n(document);
    applyTheme(getTheme());
    bindThemeToggles();
    const token = new URLSearchParams(location.search).get("token");
    if (!token) toast("Missing reset token", true);
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!token) return;
      const fd = new FormData(e.target);
      try {
        await api("/auth/password-reset/confirm", {
          method: "POST",
          body: JSON.stringify({ token, new_password: fd.get("password") }),
        });
        toast(t("reset.done"));
        location.href = "/login";
      } catch (err) {
        toast(err.message, true);
      }
    });
  </script>
</body>
</html>
