<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level Designer — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">
      <div class="page-header">
        <div>
          <h1>AI Level Designer</h1>
          <p>Describe a level — get a tilemap, enemies, and items.</p>
        </div>
      </div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label>Description
            <textarea name="description" required placeholder="Underwater temple with traps and skeleton guardians"></textarea>
          </label>
          <div class="form-row">
            <label>Width <input type="number" name="width" value="32" min="8" max="64" /></label>
            <label>Height <input type="number" name="height" value="32" min="8" max="64" /></label>
            <label>Style
              <select name="style">
                <option value="dungeon">Dungeon</option>
                <option value="cave">Cave</option>
                <option value="temple">Temple</option>
                <option value="city">City</option>
              </select>
            </label>
            <label>Project
              <select name="project_id" id="projectSelect"><option value="">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">Generate level</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> Forging level…</div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <h2>Map preview</h2>
        <div class="canvas-wrap"><canvas id="levelCanvas"></canvas></div>
        <div class="actions">
          <button class="btn btn-ghost" id="dlJson">Export JSON</button>
          <button class="btn btn-ghost" id="dlPng">Export PNG</button>
        </div>
        <div class="result-box" style="margin-top:1rem"><pre id="jsonOut"></pre></div>
      </div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI, downloadJSON } from "../js/api.js";
    import { mountShell, setLoading, toast } from "../js/app.js";
    import { downloadCanvasPNG, renderLevel } from "../js/canvas-level.js";

    if (!requireAuth()) throw new Error("auth");
    mountShell("level-designer.html");

    let lastLevel = null;
    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => {
        const o = document.createElement("option");
        o.value = p.id; o.textContent = p.name;
        sel.appendChild(o);
      });
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        const body = {
          description: fd.get("description"),
          width: Number(fd.get("width")),
          height: Number(fd.get("height")),
          style: fd.get("style"),
        };
        if (fd.get("project_id")) body.project_id = fd.get("project_id");
        const gen = await ToolsAPI.level(body);
        lastLevel = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        renderLevel(document.getElementById("levelCanvas"), lastLevel);
        document.getElementById("jsonOut").textContent = JSON.stringify(lastLevel, null, 2);
        toast(`Level ready · +${gen.xp_awarded} XP`);
      } catch (err) {
        toast(err.message, true);
      } finally {
        setLoading(document.getElementById("loader"), false);
      }
    });

    document.getElementById("dlJson").addEventListener("click", () => {
      if (lastLevel) downloadJSON("level.json", lastLevel);
    });
    document.getElementById("dlPng").addEventListener("click", () => {
      downloadCanvasPNG(document.getElementById("levelCanvas"), "level.png");
    });
  </script>
</body>
</html>
