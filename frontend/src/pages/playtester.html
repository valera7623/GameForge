<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playtester — GameForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">
      <div class="page-header">
        <div>
          <h1>AI Playtester</h1>
          <p>Automated QA: bugs, balance, and UX recommendations.</p>
        </div>
      </div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label>Game description
            <textarea name="game_description" required placeholder="Top-down dungeon crawler with crafting, stealth, and a 10-hour campaign…"></textarea>
          </label>
          <label>Scenarios (one per line)
            <textarea name="scenarios" placeholder="First boss fight&#10;Inventory overflow&#10;Quest turn-in"></textarea>
          </label>
          <div class="form-row">
            <label>Focus
              <select name="focus">
                <option value="all">All</option>
                <option value="bugs">Bugs</option>
                <option value="balance">Balance</option>
                <option value="ux">UX</option>
              </select>
            </label>
            <label>Project
              <select name="project_id" id="projectSelect"><option value="">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">Run playtest</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> Analyzing…</div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <h2>Report <span id="score"></span></h2>
        <div class="actions">
          <button class="btn btn-ghost" id="dlJson">Export JSON</button>
        </div>
        <div class="result-box" style="margin-top:1rem"><pre id="jsonOut"></pre></div>
      </div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI, downloadJSON } from "../js/api.js";
    import { mountShell, setLoading, toast } from "../js/app.js";

    if (!requireAuth()) throw new Error("auth");
    mountShell("playtester.html");
    let last = null;

    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        const scenarios = String(fd.get("scenarios") || "")
          .split("\n").map(s => s.trim()).filter(Boolean);
        const body = {
          game_description: fd.get("game_description"),
          scenarios,
          focus: fd.get("focus"),
        };
        if (fd.get("project_id")) body.project_id = fd.get("project_id");
        const gen = await ToolsAPI.playtest(body);
        last = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        document.getElementById("score").textContent = `· score ${last.overall_score}/100`;
        document.getElementById("jsonOut").textContent = JSON.stringify(last, null, 2);
        toast(`Report ready · +${gen.xp_awarded} XP`);
      } catch (err) { toast(err.message, true); }
      finally { setLoading(document.getElementById("loader"), false); }
    });

    document.getElementById("dlJson").addEventListener("click", () => last && downloadJSON("playtest-report.json", last));
  </script>
</body>
</html>
