<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="play.title">Playtester — GameForge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <script>
    (function () {
      var th = localStorage.getItem("gf_theme") || "light";
      document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
      if (localStorage.getItem("gf_lang") === "ru") document.documentElement.lang = "ru";
    })();
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app-shell">
    <main class="main-panel">

      <div class="page-header"><div>
        <h1 data-i18n="play.h1">AI Playtester</h1>
        <p data-i18n="play.sub">Get a QA-style report before you ship.</p>
      </div></div>
      <div class="panel">
        <form id="form" class="form-grid">
          <label><span data-i18n="play.desc">Game description</span>
            <textarea name="game_description" required data-i18n="play.desc_ph" data-i18n-attr="placeholder"></textarea>
          </label>
          <label><span data-i18n="play.scenarios">Scenarios (one per line)</span>
            <textarea name="scenarios" data-i18n="play.scenarios_ph" data-i18n-attr="placeholder"></textarea>
          </label>
          <div class="form-row">
            <label><span data-i18n="play.focus">Focus</span>
              <select name="focus">
                <option value="all">All</option>
                <option value="bugs">Bugs</option>
                <option value="balance">Balance</option>
                <option value="ux">UX</option>
              </select>
            </label>
            <label><span data-i18n="common.project">Project</span>
              <select name="project_id" id="projectSelect"><option value="" data-i18n="common.none">— none —</option></select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="play.submit">Run playtest</button>
        </form>
        <div class="loader" id="loader"><div class="spinner"></div> <span data-i18n="play.loading">Analyzing…</span></div>
      </div>
      <div class="panel" id="resultPanel" hidden>
        <h2><span data-i18n="play.report">Report</span> <span id="score"></span></h2>
        <div class="actions"><button class="btn btn-ghost" id="dlJson" data-i18n="play.dl">Export JSON</button></div>
        <div class="result-box" style="margin-top:1rem"><pre id="jsonOut"></pre></div>
      </div>
      <div class="panel" id="toolHistory" style="margin-top:1rem"></div>
    </main>
  </div>
  <script type="module">
    import { requireAuth } from "../js/auth.js";
    import { ProjectsAPI, ToolsAPI, downloadJSON } from "../js/api.js";
    import { mountToolHistory } from "../js/tool-history.js";
    import { applyDomI18n, mountShell, setLoading, toast, t } from "../js/app.js";
    if (!requireAuth()) throw new Error("auth");
    mountShell("playtester");
    applyDomI18n(document);
    mountToolHistory("playtester");
    let last = null;
    ProjectsAPI.list().then(list => {
      const sel = document.getElementById("projectSelect");
      list.forEach(p => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      setLoading(document.getElementById("loader"), true);
      try {
        const scenarios = String(fd.get("scenarios") || "").split("\n").map(s => s.trim()).filter(Boolean);
        const body = { game_description: fd.get("game_description"), scenarios, focus: fd.get("focus") };
        if (fd.get("project_id")) body.project_id = fd.get("project_id");
        const gen = await ToolsAPI.playtest(body);
        last = gen.output_data;
        document.getElementById("resultPanel").hidden = false;
        document.getElementById("score").textContent = t("play.score", { score: last.overall_score });
        document.getElementById("jsonOut").textContent = JSON.stringify(last, null, 2);
        toast(t("play.toast", { xp: gen.xp_awarded }));
      } catch (err) { toast(err.message, true); }
      finally { setLoading(document.getElementById("loader"), false); }
    });
    document.getElementById("dlJson").addEventListener("click", () => { if (last) downloadJSON("playtest.json", last); });
  </script>
</body>
</html>
