resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    set $api_host api;

    location /api/ {
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location /local-assets/ {
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
    }

    # Clean MPA URLs
    location = /dashboard { try_files /src/pages/dashboard.html =404; }
    location = /login { try_files /src/pages/login.html =404; }
    location = /register { try_files /src/pages/register.html =404; }
    location = /team { try_files /src/pages/team.html =404; }
    location = /level-designer { try_files /src/pages/level-designer.html =404; }
    location = /quest-generator { try_files /src/pages/quest-generator.html =404; }
    location = /texture-upscaler { try_files /src/pages/texture-upscaler.html =404; }
    location = /character-creator { try_files /src/pages/character-creator.html =404; }
    location = /sound-designer { try_files /src/pages/sound-designer.html =404; }
    location = /playtester { try_files /src/pages/playtester.html =404; }
    location = /localization { try_files /src/pages/localization.html =404; }
    location = /reset-password { try_files /src/pages/reset-password.html =404; }
    location = /accept-invite { try_files /src/pages/accept-invite.html =404; }

    location /docs {
        return 404;
    }

    location /openapi.json {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
