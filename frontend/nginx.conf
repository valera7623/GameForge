resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://mc.yandex.ru https://mc.yandex.com; frame-src https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    set $api_host api;
    # Prefer proto from edge proxy (Caddy); fall back to local scheme
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    location /api/ {
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 25m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location /local-assets/ {
        proxy_pass http://$api_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Public SEO: RU landing (canonical with trailing slash)
    location = /ru {
        return 301 /ru/;
    }
    location = /ru/ {
        try_files /src/pages/ru/index.html =404;
    }

    # Public SEO: tool marketing pages (EN)
    location = /tools/level-designer { try_files /src/pages/tools/level-designer.html =404; }
    location = /tools/quest-generator { try_files /src/pages/tools/quest-generator.html =404; }
    location = /tools/texture-upscaler { try_files /src/pages/tools/texture-upscaler.html =404; }
    location = /tools/character-creator { try_files /src/pages/tools/character-creator.html =404; }
    location = /tools/sound-designer { try_files /src/pages/tools/sound-designer.html =404; }
    location = /tools/playtester { try_files /src/pages/tools/playtester.html =404; }
    location = /tools/localization { try_files /src/pages/tools/localization.html =404; }
    location = /tools/game-balancer { try_files /src/pages/tools/game-balancer.html =404; }
    location = /tools/level-analyzer { try_files /src/pages/tools/level-analyzer.html =404; }
    location = /tools/store-description { try_files /src/pages/tools/store-description.html =404; }

    # Public SEO: tool marketing pages (RU)
    location = /ru/tools/level-designer { try_files /src/pages/ru/tools/level-designer.html =404; }
    location = /ru/tools/quest-generator { try_files /src/pages/ru/tools/quest-generator.html =404; }
    location = /ru/tools/texture-upscaler { try_files /src/pages/ru/tools/texture-upscaler.html =404; }
    location = /ru/tools/character-creator { try_files /src/pages/ru/tools/character-creator.html =404; }
    location = /ru/tools/sound-designer { try_files /src/pages/ru/tools/sound-designer.html =404; }
    location = /ru/tools/playtester { try_files /src/pages/ru/tools/playtester.html =404; }
    location = /ru/tools/localization { try_files /src/pages/ru/tools/localization.html =404; }
    location = /ru/tools/game-balancer { try_files /src/pages/ru/tools/game-balancer.html =404; }
    location = /ru/tools/level-analyzer { try_files /src/pages/ru/tools/level-analyzer.html =404; }
    location = /ru/tools/store-description { try_files /src/pages/ru/tools/store-description.html =404; }


    # Admin panel
    location = /admin { try_files /src/pages/admin/dashboard.html =404; }
    location = /admin/login { try_files /src/pages/admin/login.html =404; }
    location = /admin/users { try_files /src/pages/admin/users.html =404; }
    location = /admin/user { try_files /src/pages/admin/user.html =404; }
    location = /admin/generations { try_files /src/pages/admin/generations.html =404; }
    location = /admin/generation { try_files /src/pages/admin/generation.html =404; }
    location = /admin/subscriptions { try_files /src/pages/admin/subscriptions.html =404; }
    location = /admin/tools { try_files /src/pages/admin/tools.html =404; }
    location = /admin/settings { try_files /src/pages/admin/settings.html =404; }
    location = /admin/ai-models { try_files /src/pages/admin/ai-models.html =404; }
    location = /admin/logs { try_files /src/pages/admin/logs.html =404; }
    location = /admin/content { try_files /src/pages/admin/content.html =404; }
    location = /admin/content/edit { try_files /src/pages/admin/content-edit.html =404; }

    location = /faq { try_files /src/pages/faq.html =404; }
    location = /blog { try_files /src/pages/blog.html =404; }
    location = /blog/post { try_files /src/pages/blog-post.html =404; }
    location = /ru/faq { try_files /src/pages/ru/faq.html =404; }
    location = /ru/blog { try_files /src/pages/ru/blog.html =404; }
    location = /ru/blog/post { try_files /src/pages/ru/blog-post.html =404; }

    # Clean MPA URLs (authenticated app + auth)
    location = /dashboard { try_files /src/pages/dashboard.html =404; }
    location = /login { try_files /src/pages/login.html =404; }
    location = /register { try_files /src/pages/register.html =404; }
    location = /team { try_files /src/pages/team.html =404; }
    location = /level-designer { try_files /src/pages/level-designer.html =404; }
    location = /quest-generator { try_files /src/pages/quest-generator.html =404; }
    location = /texture-upscaler { try_files /src/pages/texture-upscaler.html =404; }
    location = /character-creator { try_files /src/pages/character-creator.html =404; }
    location = /sound-designer { try_files /src/pages/sound-designer.html =404; }
    location = /playtester { try_files /src/pages/playtester.html =404; }
    location = /localization { try_files /src/pages/localization.html =404; }
    location = /game-balancer { try_files /src/pages/game-balancer.html =404; }
    location = /level-analyzer { try_files /src/pages/level-analyzer.html =404; }
    location = /store-description { try_files /src/pages/store-description.html =404; }
    location = /reset-password { try_files /src/pages/reset-password.html =404; }
    location = /accept-invite { try_files /src/pages/accept-invite.html =404; }

    location /docs {
        return 404;
    }

    location /openapi.json {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
