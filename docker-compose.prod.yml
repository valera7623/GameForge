# Production overlay — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      # Prefer native HTTP live check (curl is present in current minio image)
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    profiles: !reset []
    restart: "no"
    volumes: !reset []
    environment:
      APP_ENV: production
      DEBUG: "false"
      ALLOW_MOCK_BILLING: "false"
      COOKIE_SECURE: "true"
      LOG_JSON: "true"
    user: "1000:1000"

  api:
    restart: unless-stopped
    volumes: !reset []
    ports: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DEBUG: "false"
      ALLOW_MOCK_BILLING: "false"
      COOKIE_SECURE: "true"
      LOG_JSON: "true"
      S3_USE_SIGNED_URLS: "true"
      S3_PUBLIC_READ: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    user: "1000:1000"

  worker:
    restart: unless-stopped
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_JSON: "true"
      ALLOW_MOCK_BILLING: "false"
      COOKIE_SECURE: "true"
      S3_USE_SIGNED_URLS: "true"
      S3_PUBLIC_READ: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  frontend:
    restart: unless-stopped
    ports: !reset []
    build:
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  docs:
    profiles: !reset []
    restart: unless-stopped
    build:
      args:
        SITE_URL: https://docs.${DOMAIN:-gameforge.website}

  caddy:
    profiles: !reset []
    restart: unless-stopped

  # CPU Real-ESRGAN — internal only (no public 8088)
  realesrgan:
    profiles: ["ai"]
    restart: unless-stopped
    ports: !reset []

  backup:
    build:
      context: .
      dockerfile: scripts/backup.Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      POSTGRES_USER: ${POSTGRES_USER:-gamedev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamedev}
      POSTGRES_DB: ${POSTGRES_DB:-gamedev}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-gamedev-assets}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      - postgres
      - minio
    networks:
      - gamedev

volumes:
  backup_data:
