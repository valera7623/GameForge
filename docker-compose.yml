services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamedev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamedev}
      POSTGRES_DB: ${POSTGRES_DB:-gamedev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamedev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gamedev

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gamedev

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    # Dev only: publish console; prod compose leaves these unbound
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - gamedev

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
      mc mb -p local/gamedev-assets || true;
      mc anonymous set none local/gamedev-assets || true;
      exit 0;
      "
    networks:
      - gamedev

  migrate:
    build: .
    profiles: ["migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"
    networks:
      - gamedev

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
    volumes:
      - ./app:/app/app
      - asset_cache:/tmp/gamedev-assets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - gamedev

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-gamedev}:${POSTGRES_PASSWORD:-gamedev}@postgres:5432/${POSTGRES_DB:-gamedev}
    volumes:
      - ./app:/app/app
      - asset_cache:/tmp/gamedev-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    networks:
      - gamedev


  realesrgan:
    profiles: ["ai"]
    build:
      context: ./services/realesrgan_stub
    ports:
      - "8088:8080"
    networks:
      - gamedev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - gamedev

  frontend-dev:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_API_URL: /api/v1
    ports:
      - "5173:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    networks:
      - gamedev

  caddy:
    image: caddy:2.10-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - gamedev

volumes:
  postgres_data:
  redis_data:
  minio_data:
  asset_cache:
  frontend_node_modules:
  caddy_data:
  caddy_config:

networks:
  gamedev:
    driver: bridge
